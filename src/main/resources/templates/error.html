<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Anime Squad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url('https://images.alphacoders.com/131/1311145.jpeg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .error-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }
        .glass-card {
            background: rgba(220, 53, 69, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 1px solid rgba(220, 53, 69, 0.2);
            padding: 50px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        h1 {
            font-size: 5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ff4d4d;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }
        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.9);
        }
        p {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
        }
        .btn-back {
            background: #ff4d4d;
            border: none;
            border-radius: 50px;
            padding: 12px 35px;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-block;
        }
        .btn-back:hover {
            background: #ff3333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 77, 77, 0.4);
            color: #fff;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="glass-card">
        <h1>Oops!</h1>
        <h2>Something went wrong</h2>
        <p>This usually happens if the form data is invalid or the database connection failed. Don't worry, even heroes fail sometimes!</p>
        <a href="/watchlist" class="btn btn-back">Return to Squad</a>
    </div>
</div>
</body>
</html>
