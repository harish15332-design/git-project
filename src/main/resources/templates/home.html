<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniTrack - Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url('https://images.alphacoders.com/131/1311145.jpeg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .home-container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }
        .glass-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            text-align: center;
            transition: transform 0.3s ease;
        }
        .glass-card:hover {
            transform: scale(1.02);
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
        }
        .btn-enter {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-weight: 600;
            font-size: 1.2rem;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4);
        }
        .btn-enter:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.6);
            color: #fff;
        }
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .glass-card { padding: 30px; }
        }
    </style>
</head>
<body>
<div class="home-container">
    <div class="glass-card">
        <h1>Welcome to Anime Squad</h1>
        <p>
            Dive into the world of Japanese animation. Track your favorite series, 
            discover new adventures, and keep your squad updated with your progress. 
            From epic battles to heartwarming stories, manage it all here.
        </p>
        <p class="fw-bold">Ready to track your progress?</p>
        <a href="/watchlist" class="btn-enter">ENTER DASHBOARD</a>
    </div>
</div>
</body>
</html>
