<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Anime Squad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url('/dragonball.jpg') no-repeat center center fixed ;
            background-size: cover;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.9);
        }
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff !important;
            border-radius: 10px;
            padding: 12px;
            transition: all 0.3s;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .btn-primary {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background: linear-gradient(45deg, #3a7bd5, #00d2ff);
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4);
        }
        .text-info {
            color: #00d2ff !important;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .text-info:hover {
            color: #fff !important;
        }
        h3 {
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        @media (max-width: 576px) {
            .glass-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body class="text-white">
<div class="login-container">
    <div class="glass-card shadow-lg">
        <h3 class="text-center fw-bold mb-4">LOGIN</h3>

        <div th:if="${param.error}" class="alert alert-danger py-2 small border-0" style="background: rgba(220, 53, 69, 0.2); color: #ff8e8e;">
            Invalid email or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-info py-2 small border-0" style="background: rgba(13, 202, 240, 0.2); color: #8ef3ff;">
            You have been logged out.
        </div>
        <div th:if="${param.success}" class="alert alert-success py-2 small border-0" style="background: rgba(25, 135, 84, 0.2); color: #8effb4;">
            Registration successful!
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-4">
                <label class="form-label small">Email Address</label>
                <input type="email" name="username" class="form-control" placeholder="Enter your email" required>
            </div>
            <div class="mb-4">
                <label class="form-label small">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">ENTER SQUAD</button>
        </form>
        <div class="mt-4 text-center small">
            <span>New here?</span> <a th:href="@{/register}" class="text-info">Create an account</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
