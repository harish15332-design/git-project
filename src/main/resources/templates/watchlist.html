<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Squad - Watchlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url('/Vinland saga.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            color: #fff;
        }
        .overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            min-height: 100vh;
            padding-bottom: 50px;
        }
        .navbar {
            background: transparent !important;
            backdrop-filter: blur(2px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px  !important;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .anime-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            padding: 7px;
        }
        .anime-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            border-color: #00d2ff;
        }
        .card-img-container {
            height: 250px;
            overflow: hidden;
            position: relative;
            border-radius:12px;
        }
        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .anime-card:hover .card-img-container img {
            transform: scale(1.1);
        }
        .form-control {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 3px solid black !important;
            color: #fff !important;
        }
        .form-control::placeholder{
        color: #ff6347 !important;
        opacity : 1!important;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.2) !important;
            border-color: red !important;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5) !important;
        }
        .btn-info {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            border: 2px solid black !important;
            color: #fff;
        }
        .btn-info:hover {
            background: linear-gradient(45deg, #3a7bd5, #00d2ff);
            color: #fff;
            transform: scale(1.05);
        }
        .badge-count {
            background: rgba(0, 210, 255, 0.2);
            border: 1px solid #00d2ff;
            color: #00d2ff;
        }
        @media (max-width: 768px) {
            .navbar-brand { font-size: 1.1rem; }
            .card-img-container { height: 200px; }
            .display-title { font-size: 1.5rem; }
        }
        @media (max-width: 576px) {
            .row-cols-sm-2 > * {
                width: 50%;
            }
            .card-img-container { height: 180px; }
            .anime-card .card-body { padding: 10px; }
            .anime-card .card-title { font-size: 0.9rem; }
        }
        .navbar-brand{
           color:red !important;
          }
    </style>
</head>
<body class="bg-dark text-white">

<div class="overlay">
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-4">
        <a class="navbar-brand fw-bold text-info" href="/watchlist">⚡ ANIME SQUAD</a>
        <div class="container">
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <form th:action="@{/watchlist}" method="get" class="d-flex mx-auto my-2 my-lg-0 w-100 w-lg-50">
                    <input class="form-control me-2 rounded-pill" type="search" name="search" th:value="${search}" placeholder="Search your squad...">
                    <button class="btn btn-outline-info rounded-pill px-4" type="submit">Search</button>
                </form>

                <form th:action="@{/logout}" method="post" class="d-flex">
                    <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-4">LOGOUT</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row align-items-center mb-4 g-3">
            <div class="col-12 col-md-4">
                <h2 class="fw-bold text-info mb-0 display-title">My Watchlist</h2>
            </div>
            <div class="col-12 col-md-8 text-md-end d-flex flex-wrap justify-content-md-end gap-2">
                <div class="btn-group me-2">
                    <a th:href="@{/watchlist(filter='all')}" class="btn btn-sm" th:classappend="${filter == null || filter == 'all'} ? 'btn-info' : 'btn-outline-info'">All</a>
                    <a th:href="@{/watchlist(filter='ongoing')}" class="btn btn-sm" th:classappend="${filter == 'ongoing'} ? 'btn-info' : 'btn-outline-info'">Ongoing</a>
                </div>
                <span class="badge rounded-pill badge-count p-2">TOTAL: <span th:text="${totalCount}">0</span></span>
                <span class="badge rounded-pill bg-success p-2">🏆 COMPLETED: <span th:text="${completedCount}">0</span></span>
            </div>
        </div>

        <div class="glass-card shadow-lg mb-5 p-3 p-md-4">
            <h5 class="text-info fw-bold mb-3">Add to Squad</h5>
            <form th:action="@{/save}" th:object="${anime}" method="post" enctype="multipart/form-data" class="row g-3 align-items-end">
                <div class="col-12 col-sm-6 col-md-2">
                    <label class="form-label small text-info">Title</label>
                    <input type="text" th:field="*{title}" class="form-control" required>
                </div>
                <div class="col-12 col-sm-6 col-md-2">
                    <label class="form-label small text-info">Genre</label>
                    <input type="text" th:field="*{genre}" class="form-control">
                </div>
                <div class="col-6 col-md-1">
                    <label class="form-label small text-info">Total Ep</label>
                    <input type="number" th:field="*{totalEpisodes}" class="form-control" required>
                </div>
                <div class="col-6 col-md-1">
                    <label class="form-label small text-info">Rating</label>
                    <input type="number" th:field="*{rating}" min="1" max="5" class="form-control">
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label small text-info">Image URL</label>
                    <input type="text" th:field="*{imageUrl}" class="form-control">
                </div>
                <div class="col-12 col-md-2">
                    <label class="form-label small text-info">Or Upload</label>
                    <input type="file" name="imageFile" class="form-control">
                </div>
                <div class="col-12 col-md-1">
                    <button type="submit" class="btn btn-info w-100 fw-bold">Save</button>
                </div>
            </form>
        </div>

        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3 g-md-4 mb-5">
            <div class="col" th:each="anime : ${animeList}">
                <div class="anime-card h-100 shadow-sm text-white">
                    <div class="card-img-container">
                        <img th:src="${anime.imageUrl}" alt="Cover" onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'">
                        <div th:if="${anime.episodesWatched == anime.totalEpisodes}" class="position-absolute top-0 end-0 m-2">
                            <span class="badge bg-success rounded-pill shadow-sm">Done ✅</span>
                        </div>
                    </div>

                    <div class="card-body p-3">
                        <h6 class="card-title fw-bold text-truncate text-info" th:text="${anime.title}">Title</h6>
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="badge bg-dark small" th:text="${anime.genre}">Genre</span>
                            <span class="text-warning small" th:text="${anime.getRatingStars()}"></span>
                        </div>
                        <div class="small mt-2">
                            <div class="progress bg-dark mb-1" style="height: 5px;">
                                <div class="progress-bar bg-info" role="progressbar" 
                                     th:style="'width: ' + (${anime.totalEpisodes > 0} ? (${anime.episodesWatched} * 100 / ${anime.totalEpisodes}) : 0) + '%'"></div>
                            </div>
                            <span class="text-light">Ep <span th:text="${anime.episodesWatched}"></span> / <span th:text="${anime.totalEpisodes}"></span></span>
                        </div>
                    </div>

                    <div class="card-footer bg-transparent border-0 d-flex justify-content-between pb-3 pt-0">
                        <form th:action="@{/anime/increment/{id}(id=${anime.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-info rounded-circle"
                                    th:disabled="${anime.episodesWatched >= anime.totalEpisodes}"><i class="bi bi-plus-lg"></i></button>
                        </form>

                        <button type="button" class="btn btn-sm btn-outline-warning rounded-circle"
                                data-bs-toggle="modal" data-bs-target="#editModal"
                                th:data-id="${anime.id}"
                                th:data-title="${anime.title}"
                                th:data-genre="${anime.genre}"
                                th:data-epwatched="${anime.episodesWatched}"
                                th:data-eptotal="${anime.totalEpisodes}"
                                th:data-rating="${anime.rating}"
                                th:data-image="${anime.imageUrl}"
                                onclick="populateModal(this)">
                            <i class="bi bi-pencil"></i>
                        </button>

                        <form th:action="@{/anime/delete/{id}(id=${anime.id})}" method="post"
                              onsubmit="return confirm('Remove from Squad?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger rounded-circle">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        
        <div th:if="${animeList.isEmpty()}" class="text-center py-5">
            <h4 class="text-secondary">No anime found here...</h4>
            <a href="/watchlist" class="btn btn-info mt-3">Back to Watchlist</a>
        </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered text-dark">
        <div class="modal-content glass-card border-0" style="background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold">Edit Anime</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/anime/update}" method="post" enctype="multipart/form-data">
                <div class="modal-body">
                    <input type="hidden" id="editId" name="id">

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Title</label>
                        <input type="text" id="editTitle" name="title" class="form-control text-dark bg-white" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Genre</label>
                        <input type="text" id="editGenre" name="genre" class="form-control text-dark bg-white">
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label small fw-bold">Episodes Watched</label>
                            <input type="number" id="editEpWatched" name="episodesWatched" class="form-control text-dark bg-white" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label small fw-bold">Total Episodes</label>
                            <input type="number" id="editEpTotal" name="totalEpisodes" class="form-control text-dark bg-white" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Rating (1-5)</label>
                        <input type="number" id="editRating" name="rating" min="1" max="5" class="form-control text-dark bg-white">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Image URL</label>
                        <input type="text" id="editImage" name="imageUrl" class="form-control text-dark bg-white">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Or Upload New Image</label>
                        <input type="file" name="imageFile" class="form-control text-dark bg-white">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" class="btn btn-info w-100 fw-bold py-2">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function populateModal(button) {
        document.getElementById('editId').value = button.getAttribute('data-id');
        document.getElementById('editTitle').value = button.getAttribute('data-title');
        document.getElementById('editGenre').value = button.getAttribute('data-genre');
        document.getElementById('editEpWatched').value = button.getAttribute('data-epwatched');
        document.getElementById('editEpTotal').value = button.getAttribute('data-eptotal');
        document.getElementById('editRating').value = button.getAttribute('data-rating');

        let image = button.getAttribute('data-image');
        document.getElementById('editImage').value = (image === 'null' || !image) ? '' : image;
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
